<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Tattva Crystal | Authentic Crystals, Zodiac Guides & Spiritual Jewellery</title>
<meta name="description" content="Tattva Crystal: authentic crystal bracelets, pendants, rings and crystal trees. Find the crystals for your zodiac sign and connect with us on Instagram.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500&family=Manrope:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{--ink:#17132E;--pearl:#F7F5FB;--am:#6D51DB;--qz:#EBBBCB;--ct:#E4B64F;--line:#DDD7EC;--mu:#6B6688;--serif:"Cormorant Garamond",Georgia,serif;--sans:Manrope,system-ui,-apple-system,"Segoe UI",sans-serif}
*{box-sizing:border-box;margin:0}
html{scroll-behavior:smooth;scroll-padding-top:72px}
body{font:400 16px/1.65 var(--sans);color:var(--ink);background:var(--pearl);-webkit-font-smoothing:antialiased}
img{max-width:100%;display:block}a{color:inherit}
h1,h2,h3{font-family:var(--serif);font-weight:600;line-height:1.1}
h2{font-size:clamp(2rem,5vw,3.2rem);margin-bottom:.6rem}
:focus-visible{outline:2px solid var(--am);outline-offset:3px}
.wrap{width:min(1120px,100% - 2.5rem);margin-inline:auto}
section{padding:clamp(3.5rem,8vw,6rem) 0}
.lead{color:var(--mu);max-width:54ch}
.btn{display:inline-block;padding:.8rem 1.6rem;border-radius:99px;background:var(--am);color:#fff;text-decoration:none;border:0;cursor:pointer;font:700 .92rem var(--sans);transition:transform .2s,background .2s}
.btn:hover{transform:translateY(-2px);background:#5b40c4}
.btn.ghost{background:transparent;border:1px solid currentColor}
header{position:sticky;top:0;z-index:50;background:rgba(23,19,46,.94);backdrop-filter:blur(12px);color:#fff}
.nav{display:flex;align-items:center;justify-content:space-between;height:64px}
.nav .brand img{height:42px;width:auto}
nav ul{display:flex;gap:1.6rem;list-style:none;padding:0}
nav a{text-decoration:none;font-size:.9rem;font-weight:500;color:#dcd6f5}
nav a:hover{color:var(--ct)}
.burger{display:none;background:none;border:0;width:40px;height:40px;cursor:pointer}
.burger span{display:block;width:22px;height:2px;background:#fff;margin:5px auto;transition:.3s}
.burger.on span:nth-child(1){transform:translateY(7px) rotate(45deg)}
.burger.on span:nth-child(2){opacity:0}
.burger.on span:nth-child(3){transform:translateY(-7px) rotate(-45deg)}
.hero{background:radial-gradient(90% 80% at 75% 30%,#3a2a7a 0,var(--ink) 60%);color:#fff;padding:clamp(4rem,9vw,7rem) 0;overflow:hidden}
